[package]
name = "tools"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
arboard = "3"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.5.26", features = ["derive"] }
clap-stdin = "0.6.0"
comrak = "0.30"
crossterm = "0.27"
ctrlc = "3.4"
dateparser = "0.2.1"
git2 = "0.20.0"
humantime = "2.1"
ignore = "0.4.25"
indoc = "2"
linkme = "0.3"
log = "0.4"
num-format = "0.4.4"
petname = "2.0.2"
rand = "0.8"
rayon = "1.10.0"
regex = "1.12.2"
resolve-path = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statistical = "1.0.0"
stderrlog = "0.6"
tempfile = "3"
toml = "0.8"
xdg = "3.0.0"
xshell = "0.2.7"

[build-dependencies]
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
indoc = "2"
